name: CI - Catálogo de Cursos

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - .NET 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/CatalogoCursos.Api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar pacotes
        run: dotnet restore --disable-parallel

      - name: Compilar sem restaurar novamente
        run: dotnet build --configuration Release --no-restore

  frontend:
    name: Frontend - TypeScript e Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar TypeScript e gerar build
        run: npm run build

  docker:
    name: Container - React + ASP.NET Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Construir imagem do serviço publicado
        run: docker build --tag sesi-catalogo-ci .

  integration:
    name: API + PostgreSQL - testes de contrato
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sesi_catalogo
          POSTGRES_USER: sesi
          POSTGRES_PASSWORD: sesi_ci_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sesi -d sesi_catalogo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar e compilar API
        run: |
          dotnet restore backend/CatalogoCursos.Api/CatalogoCursos.Api.csproj
          dotnet build backend/CatalogoCursos.Api/CatalogoCursos.Api.csproj --configuration Release --no-restore
      - name: Subir API com migrations e 6 cursos
        env:
          ASPNETCORE_ENVIRONMENT: Development
          SEED_DEMO_DATA: "true"
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=sesi_catalogo;Username=sesi;Password=sesi_ci_local"
        run: |
          dotnet run --project backend/CatalogoCursos.Api/CatalogoCursos.Api.csproj --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > /tmp/sesi-api.log 2>&1 &
          echo $! > /tmp/sesi-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sesi-api.log
          exit 1
      - name: Executar 12 cenarios reais
        run: bash tests/smoke-api.sh http://127.0.0.1:5080
      - name: Logs em caso de falha
        if: failure()
        run: cat /tmp/sesi-api.log || true

  entrega-zip:
    name: Artefato - ZIP de publicacao
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gerar artefatos compilados
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          dotnet restore backend/CatalogoCursos.Api/CatalogoCursos.Api.csproj
          dotnet publish backend/CatalogoCursos.Api/CatalogoCursos.Api.csproj -c Release --no-restore -o /tmp/sesi-519-package/app
          mkdir -p /tmp/sesi-519-package/app/wwwroot
          cp -r frontend/dist/. /tmp/sesi-519-package/app/wwwroot/
          mkdir -p /tmp/sesi-519-package/docs
          cp README.md USO_DE_IA.md Dockerfile render.yaml docker-compose.yml /tmp/sesi-519-package/
          cp docs/*.md /tmp/sesi-519-package/docs/
          git archive --format=zip --output=/tmp/sesi-519-package/codigo-fonte.zip HEAD
          (cd /tmp && zip -q -r "${GITHUB_WORKSPACE}/sesi-519-publicacao.zip" sesi-519-package)
      - name: Disponibilizar ZIP para o candidato
        uses: actions/upload-artifact@v4
        with:
          name: sesi-519-publicacao
          path: sesi-519-publicacao.zip
          retention-days: 7
          if-no-files-found: error
